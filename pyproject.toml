[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jev_bot*", "jev_mcp*"]

[project]
name = "jev-poc"
version = "0.1.0"
description = "Reusable OpenRouter JEV Decisions API client and conversational CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.12.0",
    "python-dotenv>=1.0.0",
    "requests>=2.34.2",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
jev = "jev_bot.cli:app"

[tool.setuptools.package-data]
jev_bot = ["assets/**/*"]
